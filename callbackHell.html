<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callback Hell</title>
</head>

<body>
    <h1>Callback Hell</h1>


    <script>
        const getData = (data, callback) => {
            setTimeout(() => {
                console.log("Getting Data " + data + "....");
                callback()
            }, 2000)
        }

        getData(1, () => {
            getData(2, () => {
                getData(3, () => {
                    getData(4, () => {
                        getData(5, () => {
                            getData(6, () => {
                                getData(7, () => {
                                    console.log(("NASA HACKED..."));
                                })
                            })
                        })
                    })
                })
            })
        })


    </script>
</body>

</html>
