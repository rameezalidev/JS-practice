<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Methods</title>
</head>
<body>
    <h1>Array Methods</h1>

    <script>
        let arr = [1,2,3,4];
        arr.push(10);
        console.log(arr)
        arr.push(1,2,3,4)
        console.log(arr)
        let value = 43;
        arr.push(value);
        console.log(arr);
        arr.push(value+20);
        console.log(arr);

 
        // reset Array
        arr = [1,2,3,4]
        arr.pop();
        console.log(arr);
        arr.pop()


        //Shift 
        arr = [1,2,3,4]
        arr.unshift(20);
        console.log(arr);
        arr.unshift(5,6,7,8);
        console.log(arr)


        arr = [1,2,3,4];
        arr.shift();
        console.log(arr)


        // add at specific position
        arr.splice(1,3,1,2,3);
        console.log(arr)

        arr.splice(1,1,45);
        console.log(arr);


        // slice
        arr = [3,4,2,1];
        console.log(arr.slice(1,3))

        console.log(arr.slice(-4,-1))

        //map

        let res = arr.map((el,idx)=>{
            return el * 2;
        })
        console.log(res);

        // filter

        let filteredRes = arr.filter((el,idx)=>{
            return el % 2 == 0;
        })

        console.log(filteredRes)

        // reduce

        let result = arr.reduce((acc,el,idx)=>{
            return acc+=el;
        },0)
        console.log(result);

        // sort

        arr.sort((a,b)=>a-b)
        console.log(arr)
        arr.sort((a,b)=>b-a)
        console.log(arr)
        arr.sort((a,b)=>a-b)

        //find
        let finded = arr.find((el)=>{
            return el > 1;
        })
        console.log(finded)

        
    </script>
</body>
</html>
