<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Methods</title>
</head>
<body>
    <h1>Array Methods</h1>

    <script>
        let arr = [1,2,3,4];
        arr.push(10);
        console.log(arr)
        arr.push(1,2,3,4)
        console.log(arr)
        let value = 43;
        arr.push(value);
        console.log(arr);
        arr.push(value+20);
        console.log(arr);

 
        // reset Array
        arr = [1,2,3,4]
        arr.pop();
        console.log(arr);
        arr.pop()


        //Shift 
        arr = [1,2,3,4]
        arr.unshift(20);
        console.log(arr);
        arr.unshift(5,6,7,8);
        console.log(arr)


        arr = [1,2,3,4];
        arr.shift();
        console.log(arr)

        
    </script>
</body>
</html>
